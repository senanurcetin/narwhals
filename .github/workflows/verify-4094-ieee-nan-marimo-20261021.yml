name: Validate #4094 IEEE NaN and marimo compatibility
on:
  push:
    branches:
      - qa/4094-preserve-ieee-nan-20261021
permissions:
  contents: read
jobs:
  pandas-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'pandas>=2.2,<3.1' pytest pytest-env pytest-randomly pytest-xdist hypothesis ruff
      - name: Verify nullable and IEEE NaN rows
        run: python -m pytest -q tests/frame/rows_nullable_test.py --disable-warnings --maxfail=1
      - name: Ruff checks
        if: always()
        run: |
          python -m ruff check src/narwhals/_pandas_like/dataframe.py tests/frame/rows_nullable_test.py
          python -m ruff format --check src/narwhals/_pandas_like/dataframe.py tests/frame/rows_nullable_test.py
  marimo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Clone marimo
        run: git clone https://github.com/marimo-team/marimo.git --depth=1
      - name: Install this Narwhals branch into marimo
        run: |
          cd marimo
          uv add ../ --editable
          uv run --python 3.12 python -c "import narwhals; print(narwhals.__file__)"
      - name: Run marimo downstream Narwhals tests
        run: |
          cd marimo
          scripts/test-narwhals.sh --python=3.12
