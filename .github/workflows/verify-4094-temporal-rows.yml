name: Verify Narwhals 4094 temporal rows
on:
  push:
    branches:
      - verify/4094-temporal-rows-20261021
permissions:
  contents: read
jobs:
  pandas-row-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            pandas-version: 'pandas>=2.2,<3'
          - python-version: '3.13'
            pandas-version: 'pandas>=3,<4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "${{ matrix.pandas-version }}" "pytest>=9" pytest-env pytest-randomly pytest-xdist hypothesis packaging ruff
      - name: Run nullable and temporal row regressions
        run: python -m pytest -q tests/frame/rows_nullable_test.py --disable-warnings --maxfail=1
      - name: Lint regression test file
        if: always()
        run: |
          python -m ruff check tests/frame/rows_nullable_test.py
          python -m ruff format --check tests/frame/rows_nullable_test.py
